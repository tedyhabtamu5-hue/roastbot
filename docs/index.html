<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roast Admin</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#14141c">
<style>
:root{--bg:#14141c;--card:#1e1e2a;--tx:#f2f2f7;--mu:#9a9ab0;--ac:#ff7a1a;--bd:#2e2e3e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}
h1{font-size:22px}h2{font-size:15px;color:var(--mu);margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px;font:inherit}
button{background:var(--ac);color:#111;border:0;border-radius:10px;padding:10px 14px;font:600 15px system-ui;cursor:pointer}
button.g{background:var(--bd);color:var(--tx)}.row{display:flex;gap:8px}.row>input{flex:1}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:6px 10px;margin:0 6px 6px 0}
.chip b{cursor:pointer;color:var(--ac)}.mu{color:var(--mu);font-size:13px}#msg{min-height:20px;font-size:14px;color:var(--ac)}
label.sw{display:flex;justify-content:space-between;align-items:center}input[type=checkbox]{width:24px;height:24px}
</style></head><body>
<h1>Roast Admin</h1><div id="msg"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=JSON.parse(localStorage.getItem('rb')||'{}'),cfg={enabled:true,intensity:'savage',off_limits:[],notes:''},sha=null;
const say=t=>$('#msg').textContent=t;
async function api(p,o={}){const r=await fetch('https://api.github.com/repos/'+S.repo+p,{...o,headers:{Authorization:'Bearer '+S.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
 if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,100));return r.status==204?null:r.json()}
const b64=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function load(){try{const f=await api('/contents/config.json');sha=f.sha;
 cfg={...cfg,...JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(f.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))};}catch(e){say('Could not load config: '+e.message)}
 render();runs()}
async function save(){cfg.notes=$('#notes').value;cfg.intensity=$('#int').value;cfg.enabled=$('#on').checked;
 try{const r=await api('/contents/config.json',{method:'PUT',body:JSON.stringify({message:'update config',content:b64(JSON.stringify(cfg,null,2)),sha})});sha=r.content.sha;say('Saved. Applies on the next run.')}catch(e){say('Save failed: '+e.message)}}
function add(){const v=$('#nt').value.trim();if(v&&!cfg.off_limits.includes(v)){cfg.off_limits.push(v);$('#nt').value='';chips()}}
function del(i){cfg.off_limits.splice(i,1);chips()}
function chips(){$('#chips').innerHTML=cfg.off_limits.map((t,i)=>`<span class="chip">${esc(t)} <b onclick="del(${i})">&times;</b></span>`).join('')||'<span class="mu">Nothing banned yet.</span>'}
async function runNow(){try{const br=(await api('')).default_branch;await api('/actions/workflows/roast.yml/dispatches',{method:'POST',body:JSON.stringify({ref:br})});say('Run started.');setTimeout(runs,4000)}catch(e){say('Failed: '+e.message)}}
async function runs(){try{const r=await api('/actions/workflows/roast.yml/runs?per_page=5');
 $('#runs').innerHTML=r.workflow_runs.map(x=>`<div class="mu">${new Date(x.created_at).toLocaleString()} &mdash; ${x.conclusion||x.status}</div>`).join('')||'<div class="mu">No runs yet.</div>'}catch(e){}}
function setup(){S={repo:$('#repo').value.trim(),token:$('#tok').value.trim()};localStorage.setItem('rb',JSON.stringify(S));load()}
function logout(){localStorage.removeItem('rb');S={};render()}
function render(){
 if(!S.repo||!S.token){$('#app').innerHTML=`<div class="card"><h2>Admin login</h2><p class="mu">Repo as owner/name, and a GitHub fine-grained token for that repo only (Contents: read/write, Actions: read/write). Stored only in this browser. Without it nobody can change anything.</p><input id="repo" placeholder="yourname/roastbot" style="margin-bottom:8px"><input id="tok" type="password" placeholder="github_pat_..." style="margin-bottom:8px"><button onclick="setup()">Connect</button></div>`;return}
 $('#app').innerHTML=`<div class="card"><label class="sw"><span>Bot switched on</span><input id="on" type="checkbox" ${cfg.enabled?'checked':''}></label></div>
 <div class="card"><h2>Intensity</h2><select id="int"><option value="mild">Mild</option><option value="spicy">Spicy</option><option value="savage">Savage (dark humor)</option></select></div>
 <div class="card"><h2>Banned topics</h2><div id="chips"></div><div class="row"><input id="nt" placeholder="Add a topic, e.g. religion" onkeydown="if(event.key=='Enter')add()"><button onclick="add()">Add</button></div></div>
 <div class="card"><h2>Extra instructions</h2><textarea id="notes" rows="3" placeholder="e.g. Roast in Amharic slang, go easy on Sara">${esc(cfg.notes)}</textarea></div>
 <div class="row"><button onclick="save()" style="flex:1">Save</button><button class="g" onclick="runNow()">Run now</button></div>
 <div class="card" style="margin-top:14px"><h2>Recent runs</h2><div id="runs" class="mu">Loading...</div></div>
 <p class="mu">The script always keeps its own safety floor: no slurs and no attacks on people for race, religion, disability or sexuality. Your banned list adds to it. <a href="#" onclick="logout()" style="color:var(--ac)">Log out</a></p>`;
 $('#int').value=cfg.intensity;chips()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
S.repo?load():render();
</script></body></html>
