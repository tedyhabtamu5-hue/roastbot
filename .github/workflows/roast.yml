name: roast
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: roast
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ig_session.json
          key: session-${{ github.run_id }}
          restore-keys: session-
      - run: python roastbot.py --once
        env:
          IG_USER: ${{ secrets.IG_USER }}
          IG_PASS: ${{ secrets.IG_PASS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROUP_NAME: ${{ secrets.GROUP_NAME }}
